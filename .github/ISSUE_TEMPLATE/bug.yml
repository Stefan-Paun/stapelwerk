name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! If a level is involved, please name it and paste the code you ran (it never contains personal data unless you put it there).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? Screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open level 2.2\n2. Paste the code below\n3. Press Run"
    validations:
      required: false
  - type: textarea
    id: code
    attributes:
      label: Assembly code (if relevant)
      render: asm
    validations:
      required: false
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Website (browser)
        - Local build (npm start)
        - Command-line tool (stapelwerk)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "e.g. Firefox 140 on Windows 11"
    validations:
      required: false

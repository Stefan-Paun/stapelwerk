[workspace]
resolver = "3"
members = ["crates/core", "crates/wasm", "crates/cli"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/Stefan-Paun/stapelwerk"
publish = false

# Zero third-party crates, including dev-dependencies (see docs/STATUS.md and SPEC section 1).

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
